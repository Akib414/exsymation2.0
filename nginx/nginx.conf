# Nginx reverse proxy — terminates HTTPS, forwards to Node app.
# Replace example.com with the real domain. Get certs on the server with:
#   certbot --nginx -d example.com
# Node must run with trust proxy enabled (see server/src/app.js).

upstream app {
  server app:3000;
}

upstream client {
  server client:80;
}

# HTTP → HTTPS redirect
server {
  listen 80;
  server_name example.com www.example.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS → Node
server {
  listen 443 ssl;
  server_name example.com www.example.com;

  ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

  # API (Node) — must stay before / so /api/* never hits the SPA fallback.
  location /api/ {
    proxy_pass http://app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA (Vite dist) — React Router paths fall back to index.html in client/nginx.conf.
  location / {
    proxy_pass http://client;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
