name: CI/CD Pipeline

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - dev
      - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Audit dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - name: Build Docker image
        run: docker build -t exsymation-server .

      - name: Scan image with Trivy (blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: exsymation-server
          format: table
          severity: CRITICAL
          exit-code: "1"

      - name: Scan image with Trivy (advisory)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: exsymation-server
          format: table
          severity: HIGH
          exit-code: "0"

      - name: Run Docker container
        run: docker run -d -p 3000:3000 --read-only --cap-drop ALL --restart unless-stopped --mount type=tmpfs,destination=/app/logs --memory=512m --cpus=1 --name exsymation-container exsymation-server

      - name: Wait for application to start
        run: sleep 5

      - name: Test deployed application
        run: curl http://localhost:3000

      - name: Stop Docker container
        if: always()
        run: docker stop exsymation-container