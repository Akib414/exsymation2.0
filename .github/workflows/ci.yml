name: CI/CD Pipeline

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - dev
      - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Audit dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Audit client dependencies
        working-directory: client
        run: npm audit --omit=dev --audit-level=high

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Build Docker image
        run: docker build -t exsymation-server .

      - name: Scan image with Trivy (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: exsymation-server
          format: table
          severity: CRITICAL
          exit-code: "1"

      - name: Scan image with Trivy (advisory)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: exsymation-server
          format: table
          severity: HIGH
          exit-code: "0"

      - name: Generate test secrets
        run: |
          JWT_SECRET=$(openssl rand -hex 64)
          JWT_ADMIN_SECRET=$(openssl rand -hex 64)
          ENCRYPTION_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$JWT_ADMIN_SECRET"
          echo "::add-mask::$ENCRYPTION_KEY"
          echo "JWT_SECRET=$JWT_SECRET" >> $GITHUB_ENV
          echo "JWT_ADMIN_SECRET=$JWT_ADMIN_SECRET" >> $GITHUB_ENV
          echo "ENCRYPTION_KEY=$ENCRYPTION_KEY" >> $GITHUB_ENV

      - name: Run Docker container
        run: docker run -d --network host --read-only --cap-drop ALL --restart unless-stopped --mount type=tmpfs,destination=/app/logs --memory=512m --cpus=1 --env MONGO_URI=mongodb://localhost:27017/exsymation-ci --env JWT_SECRET --env JWT_ADMIN_SECRET --env ENCRYPTION_KEY --name exsymation-container exsymation-server

      - name: Wait for application to start
        run: sleep 10

      - name: Test deployed application
        run: curl --max-time 30 --retry 5 --retry-delay 5 http://localhost:3000

      - name: Build client Docker image
        run: docker build -t exsymation-client ./client

      - name: Scan client image with Trivy (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: exsymation-client
          format: table
          severity: CRITICAL
          exit-code: "1"

      - name: Run client container
        run: docker run -d -p 8080:80 --read-only --cap-drop ALL --cap-add CHOWN --restart unless-stopped --tmpfs /var/cache/nginx --tmpfs /var/run --tmpfs /tmp --memory=256m --cpus=0.5 --name exsymation-client exsymation-client

      - name: Wait for client to start
        run: sleep 5

      - name: Inspect client container
        if: always()
        run: docker ps --filter name=exsymation-client; docker logs exsymation-client || true

      - name: Test deployed client
        timeout-minutes: 3
        run: |
          curl --max-time 30 --retry 5 --retry-delay 3 http://localhost:8080 | grep -i "exsymation\|sign in\|root" || {
            echo "--- docker ps ---"
            docker ps -a --filter name=exsymation-client
            echo "--- docker logs ---"
            docker logs exsymation-client || true
            exit 1
          }

      - name: Stop Docker containers
        if: always()
        run: docker rm -f exsymation-container exsymation-client || true