services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - 3000
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /app/logs
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  client:
    build:
      context: ./client
      # Same-origin API: keep empty so the browser calls /api on this host,
      # which nginx proxies to app. Set to the API origin only if split-hosted.
      args:
        VITE_API_BASE: ""
    restart: unless-stopped
    expose:
      - 80
    read_only: true
    cap_drop:
      - ALL
    # nginx master starts as root and chowns cache dirs to uid 101.
    cap_add:
      - CHOWN
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      client:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Certs on the host (certbot). Remove :ro test lines if unused.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    read_only: true
    cap_drop:
      - ALL
    # Same as client: nginx needs CHOWN for its cache dirs under read-only rootfs.
    cap_add:
      - CHOWN
    tmpfs:
      - /var/cache/nginx
      - /var/run
