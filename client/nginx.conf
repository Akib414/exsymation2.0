server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — React Router paths resolve to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static asset caching.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
